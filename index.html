<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StickerPrint - Premium A4 Sticker Sheet Printer</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/buttons.css"><link rel="stylesheet" href="css/preview.css"><link rel="stylesheet" href="css/cell.css">
  <link rel="stylesheet" href="css/toolbar.css"><link rel="stylesheet" href="css/locks-toast.css"><link rel="stylesheet" href="css/print.css">
</head>
<body>
  <div class="app-container" x-data :style="$store.stickerStore.rootStyles()" id="app-container" style="display: none;">
    <div id="sidebar-placeholder"></div>
    <main class="preview-area">
      <div class="sheet-wrapper">
        <div class="a4-sheet" id="a4-sheet"><div id="grid-placeholder"></div></div>
      </div>
    </main>
    <input type="file" id="file-picker" class="hidden-file-input" accept="image/*" @change="$store.stickerStore.handleFilePickerChange($event)">
    <div class="toast-container" id="toast-container">
      <template x-for="toast in $store.stickerStore.toasts" :key="toast.id">
        <div class="toast" x-text="toast.message"></div>
      </template>
    </div>
  </div>

  <script type="module">
    import './js/app.js';

    async function bootstrap() {
      try {
        const parts = ['sidebar-header', 'sidebar-instructions', 'sidebar-modes', 'sidebar-dimensions', 'sidebar-inset', 'sidebar-layout', 'sidebar-calibration', 'sidebar-footer', 'cell'];
        const htmls = await Promise.all(parts.map(p => fetch(`components/${p}.html`).then(r => r.text())));
        
        document.getElementById('sidebar-placeholder').outerHTML = htmls.slice(0, 8).join('');
        
        const cellInner = htmls[8];
        const labels = ['Top-Left', 'Top-Right', 'Bottom-Left', 'Bottom-Right'];
        let gridHtml = '<div class="sticker-grid">';
        for (let i = 0; i < 4; i++) {
          gridHtml += `
            <div class="sticker-cell" x-data="{ index: ${i} }"
                 :class="{ 
                   'selected': $store.stickerStore.cellModes[index] === 'single' && $store.stickerStore.selectedIndex === index * 2, 
                   'has-image': $store.stickerStore.cellModes[index] === 'single' && $store.stickerStore.images[index * 2] !== null,
                   'dual-mode': $store.stickerStore.cellModes[index] === 'dual'
                 }"
                 @click="if ($store.stickerStore.cellModes[index] === 'single') $store.stickerStore.selectCell(index * 2)"
                 @dragover.prevent="if ($store.stickerStore.cellModes[index] === 'single') $store.stickerStore.dragOverIndex = index * 2"
                 @dragleave="if ($store.stickerStore.cellModes[index] === 'single' && $store.stickerStore.dragOverIndex === index * 2) $store.stickerStore.dragOverIndex = null"
                 @drop.prevent="if ($store.stickerStore.cellModes[index] === 'single') $store.stickerStore.cellDrop($event, index * 2)"
                 data-index="${i}" data-label="${labels[i]}">
              ${cellInner}
            </div>`;
        }
        gridHtml += '</div>';
        document.getElementById('grid-placeholder').outerHTML = gridHtml;
        document.getElementById('app-container').style.display = 'flex';

        const alpineScript = document.createElement('script');
        alpineScript.src = "https://cdn.jsdelivr.net/npm/alpinejs@3.14.7/dist/cdn.min.js";
        alpineScript.integrity = "sha384-cixRWCxxaN2ZlgSKys0xeW++971nkjz01WMhvEVsYDm6hlVuq/vm14WM+CLfIkBB";
        alpineScript.crossOrigin = "anonymous";
        alpineScript.defer = true;
        document.head.appendChild(alpineScript);
      } catch (err) {
        console.error("Bootstrap loading failed:", err);
      }
    }
    await bootstrap();
  </script>
</body>
</html>
